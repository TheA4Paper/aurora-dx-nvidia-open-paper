# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: aurora-dx-nvidia-open-paper
description: Custom Aurora DX Nvidia Open with Roc Toolkit and Yakuake drop-down terminal
base-image: ghcr.io/ublue-os/aurora-dx-nvidia-open
image-version: stable # Change to 'latest' if you prefer bleeding-edge tracking

modules:
  - type: signing
  - type: dnf
    install:
      packages:
        - yakuake
        - pipewire-module-roc
        - roc-toolkit
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - io.github.getnf.embellish
          - io.podman_desktop.PodmanDesktop
          - me.iepure.devtoolbox
          - com.bitwarden.desktop
          - com.valvesoftware.Steam
          - dev.vencord.Vesktop
          - org.prismlauncher.PrismLauncher
          - org.videolan.VLC
          - org.qbittorrent.qBittorrent
          - org.onlyoffice.desktopeditors
